# Netlify build configuration — Desert Grey Music Festival

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Redirect Decap CMS proxy calls to our function
[[redirects]]
  from = "/api/v1"
  to = "/.netlify/functions/cms/api/v1"
  status = 200
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/cms/api/v1/:splat"
  status = 200

# Site-wide security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Lock /admin from being indexed
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# CMS uploaded media — long cache, immutable
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro CSS / JS — fingerprinted, long cache
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
