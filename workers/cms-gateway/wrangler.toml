name = "desertgrey-cms"
main = "src/index.js"
compatibility_date = "2026-01-15"

# KV namespace for sessions + rate limiting. Set the id after `wrangler kv namespace create`.
[[kv_namespaces]]
binding = "CMS_KV"
id = "REPLACE_WITH_KV_ID"

# Non-secret config (edit then `npm run deploy`)
[vars]
GITHUB_OWNER     = "diegolujanstudio"
GITHUB_REPO      = "desertgreyfestival"
GITHUB_BRANCH    = "main"
ADMIN_USERNAME   = "admin"
SITE_URL         = "https://desertgrey.netlify.app"

# Secrets (set via `wrangler secret put` — never commit these):
#   GITHUB_TOKEN          fine-grained PAT, Contents:RW on the target repo
#   ADMIN_PASSWORD_HASH   PBKDF2 hash, format "pbkdf2$iter$saltHex$hashHex"
#   SESSION_SECRET        random 32-byte hex for signing session cookies
