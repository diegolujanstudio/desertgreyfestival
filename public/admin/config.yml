# Decap CMS configuration — Desert Grey Music Festival
backend:
  name: proxy
  proxy_url: /api/v1
  branch: main
  commit_messages:
    create: 'CMS: create {{collection}} "{{slug}}"'
    update: 'CMS: update {{collection}} "{{slug}}"'
    delete: 'CMS: delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload {{path}}'
    deleteMedia: 'CMS: delete {{path}}'

media_folder: "public/uploads"
public_folder: "/uploads"
publish_mode: simple
site_url: https://desertgrey.netlify.app
display_url: https://desertgrey.netlify.app
logo_url: /favicon-256.png

collections:

  - name: "site_info"
    label: "⚙️  Site Settings"
    files:
      - label: "Festival Info"
        name: "site"
        file: "src/data/site.json"
        fields:
          - { label: "Page Title (browser tab)", name: "title", widget: "string" }
          - { label: "Festival Name", name: "festival_name", widget: "string" }
          - { label: "Festival Subtitle", name: "festival_subtitle", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Date (ISO format, used for countdown)", name: "date_iso", widget: "datetime" }
          - { label: "Date Display (shown on hero)", name: "date_display", widget: "string", hint: "e.g. Sat · 10.03.26" }
          - { label: "Venue (short)", name: "venue_short", widget: "string" }
          - { label: "PurplePass Ticket URL", name: "purplepass_url", widget: "string" }
          - { label: "Spotify Playlist URL", name: "spotify_playlist_url", widget: "string" }
          - { label: "Spotify Embed URL", name: "spotify_embed_url", widget: "string" }

  - name: "announcement"
    label: "🔔  Announcement Bar"
    files:
      - label: "Announcement Bar"
        name: "announcement"
        file: "src/data/announcement.json"
        fields:
          - { label: "Label Text", name: "label", widget: "string" }
          - { label: "Button Text", name: "cta_text", widget: "string" }
          - { label: "Button Link", name: "cta_href", widget: "string" }

  - name: "hero"
    label: "🎬  Hero (Top of Page)"
    files:
      - label: "Hero Section"
        name: "hero"
        file: "src/data/hero.json"
        fields:
          - { label: "Eyebrow Text (small line above title)", name: "eyebrow", widget: "string" }
          - { label: "Title Line 1", name: "title_line_1", widget: "string" }
          - { label: "Title Line 2 (highlighted in magenta)", name: "title_line_2", widget: "string" }
          - { label: "Title Line 3 (small, spaced)", name: "title_line_3", widget: "string" }
          - { label: "Tagline (italic line beneath title)", name: "tagline", widget: "text" }
          - { label: "Date Eyebrow", name: "date_eyebrow", widget: "string" }
          - { label: "Date Display", name: "date_display", widget: "string" }
          - { label: "Date Caption", name: "date_caption", widget: "string" }
          - { label: "Primary Button Text", name: "cta_primary_text", widget: "string" }
          - { label: "Primary Button Link", name: "cta_primary_href", widget: "string" }
          - { label: "Secondary Button Text", name: "cta_secondary_text", widget: "string" }
          - { label: "Secondary Button Link", name: "cta_secondary_href", widget: "string" }
          - { label: "Background Video", name: "background_video", widget: "file", hint: "MP4, under 10MB recommended" }

  - name: "navigation"
    label: "🧭  Top Navigation"
    files:
      - label: "Navigation"
        name: "nav"
        file: "src/data/nav.json"
        fields:
          - { label: "Wordmark (Top Line)", name: "wordmark_top", widget: "string" }
          - { label: "Wordmark (Bottom Line)", name: "wordmark_sub", widget: "string" }
          - label: "Menu Links"
            name: "links"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - { label: "Top-Right Button Text", name: "cta_text", widget: "string" }
          - { label: "Top-Right Button Link", name: "cta_href", widget: "string" }

  - name: "marquee"
    label: "📜  Scrolling Marquee"
    files:
      - label: "Marquee Lines"
        name: "marquee"
        file: "src/data/marquee.json"
        fields:
          - label: "Top Marquee (Genres)"
            name: "primary"
            widget: "list"
          - label: "Bottom Marquee (Facts)"
            name: "secondary"
            widget: "list"

  - name: "intro"
    label: "💬  About / Intro"
    files:
      - label: "Intro Section"
        name: "intro"
        file: "src/data/intro.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Curated By", name: "curated_by", widget: "string" }
          - { label: "Headline", name: "headline", widget: "text" }
          - { label: "Highlighted Word in Headline", name: "headline_emphasis", widget: "string" }
          - { label: "Paragraph 1", name: "paragraph_1", widget: "text" }
          - { label: "Paragraph 2 (muted)", name: "paragraph_2", widget: "text" }

  - name: "lineup"
    label: "🎸  Lineup"
    files:
      - label: "Lineup"
        name: "lineup"
        file: "src/data/lineup.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Rollout Note", name: "rollout_note", widget: "string" }
          - { label: "CTA Button Text", name: "cta_text", widget: "string" }
          - { label: "CTA Button Link", name: "cta_href", widget: "string" }
          - { label: "Headliners (huge, top tier)", name: "headliners", widget: "list" }
          - { label: "Main Bill (medium tier)", name: "main", widget: "list" }
          - { label: "Support / Openers (small tier)", name: "support", widget: "list" }

  - name: "schedule"
    label: "🕐  Schedule"
    files:
      - label: "Schedule"
        name: "schedule"
        file: "src/data/schedule.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline Emphasis Word", name: "headline_emphasis", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Fine Print", name: "fine_print", widget: "text" }
          - label: "Stages"
            name: "stages"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Stage ID (lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Stage Name", name: "name", widget: "string" }
              - label: "Set Times"
                name: "slots"
                widget: "list"
                summary: "{{fields.time}} — {{fields.band}}"
                fields:
                  - { label: "Time", name: "time", widget: "string" }
                  - { label: "Band / Artist", name: "band", widget: "string" }
                  - { label: "Note (optional)", name: "note", widget: "string", required: false }

  - name: "tickets"
    label: "🎫  Tickets"
    files:
      - label: "Tickets"
        name: "tickets"
        file: "src/data/tickets.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline Emphasis", name: "headline_emphasis", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Fine Print", name: "fine_print", widget: "text" }
          - label: "Ticket Tiers"
            name: "tiers"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Tier Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Note", name: "note", widget: "string" }
              - { label: "Perks (bullet points)", name: "perks", widget: "list" }
              - { label: "Button Text", name: "cta", widget: "string" }
              - { label: "Featured (highlights this tier)", name: "featured", widget: "boolean", default: false }

  - name: "partners"
    label: "🤝  Partners"
    files:
      - label: "Partners"
        name: "partners"
        file: "src/data/partners.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline Emphasis", name: "headline_emphasis", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Tiers"
            name: "tiers"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Tier Label (Presenting / Official / Community)", name: "label", widget: "string" }
              - { label: "Partner Names", name: "partners", widget: "list" }

  - name: "listen"
    label: "🎧  Listen / Spotify"
    files:
      - label: "Listen Section"
        name: "listen"
        file: "src/data/listen.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline Emphasis", name: "headline_emphasis", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Button Text", name: "cta_text", widget: "string" }
          - { label: "Spotify Playlist URL", name: "spotify_url", widget: "string" }
          - { label: "Spotify Embed URL", name: "spotify_embed_url", widget: "string" }

  - name: "venue"
    label: "📍  Venue"
    files:
      - label: "Venue Section"
        name: "venue"
        file: "src/data/venue.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline Emphasis", name: "headline_emphasis", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Address Name", name: "address_name", widget: "string" }
          - { label: "Address Line 1", name: "address_line_1", widget: "string" }
          - { label: "Address Line 2", name: "address_line_2", widget: "string" }
          - { label: "Map Embed URL", name: "map_embed_src", widget: "string" }
          - { label: "Map Link URL", name: "map_link_url", widget: "string" }
          - label: "Quick Facts"
            name: "facts"
            widget: "list"
            summary: "{{fields.key}} — {{fields.value}}"
            fields:
              - { label: "Label", name: "key", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
          - { label: "Travel Section Title", name: "travel_title", widget: "string" }
          - label: "Travel Info"
            name: "travel"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Mode Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "faq"
    label: "❓  FAQ"
    files:
      - label: "FAQ"
        name: "faq"
        file: "src/data/faq.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Headline Emphasis", name: "headline_emphasis", widget: "string" }
          - { label: "Footer Note", name: "footer_note", widget: "text" }
          - label: "Questions & Answers"
            name: "items"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "footer"
    label: "🦶  Footer"
    files:
      - label: "Footer"
        name: "footer"
        file: "src/data/footer.json"
        fields:
          - { label: "Sponsors Strip Label", name: "sponsors_label", widget: "string" }
          - { label: "Sponsors", name: "sponsors", widget: "list" }
          - { label: "Festival Name", name: "festival_name", widget: "string" }
          - { label: "Festival Subtitle", name: "festival_subtitle", widget: "string" }
          - { label: "Address Lines", name: "address_lines", widget: "list" }
          - { label: "'Explore' Column Label", name: "explore_label", widget: "string" }
          - label: "Explore Column Links"
            name: "explore_links"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }
          - { label: "'Follow' Column Label", name: "follow_label", widget: "string" }
          - label: "Follow Column Items"
            name: "follow_items"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link (empty = plain text)", name: "href", widget: "string", required: false }
          - { label: "'Desert Grey' Column Label", name: "info_label", widget: "string" }
          - { label: "Info Column Items", name: "info_items", widget: "list" }
          - { label: "Copyright Line", name: "copyright", widget: "string" }
          - { label: "Legal Strip", name: "legal_strip", widget: "string" }
