<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Desert Grey · Content Editor</title>
  <link rel="icon" href="/favicon-32.png" />
  <style>
    :root {
      --bg: #000000;
      --fg: #FFFFFF;
      --muted: #6B6B6B;
      --line: #1A1A1A;
      --line-strong: #2A2A2A;
      --error: #FF6363;
      --success: #6BE578;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      font-feature-settings: "ss01", "cv01";
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }
    a { color: inherit; }
    .shell {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
    }
    .brand {
      text-align: center;
      margin-bottom: 56px;
    }
    .brand-mark {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0 0 8px 0;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }
    .field {
      display: grid;
    }
    input {
      width: 100%;
      padding: 14px 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      letter-spacing: -0.005em;
      transition: border-color 0.2s ease;
    }
    input:focus {
      outline: none;
      border-bottom-color: var(--fg);
    }
    input::placeholder { color: var(--muted); }
    button {
      width: 100%;
      padding: 16px 0;
      margin-top: 14px;
      background: var(--fg);
      color: var(--bg);
      border: 0;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: wait; }
    .status {
      margin-top: 18px;
      font-size: 12px;
      text-align: center;
      min-height: 1.2em;
      letter-spacing: 0;
    }
    .status.err { color: var(--error); }
    .status.ok { color: var(--success); }
    .footer-note {
      margin-top: 56px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .loading {
      display: grid;
      place-items: center;
      min-height: 100vh;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    /* CMS body overrides — make Decap fit our aesthetic */
    #cms-root.active { background: #F5F5F5; min-height: 100vh; }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login-shell" class="shell">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">Desert Grey</div>
        <h1 class="brand-title">Content Editor</h1>
        <p class="brand-sub">Sign in to manage the website.</p>
      </div>
      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" autofocus required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button id="submit-btn" type="submit">Sign in</button>
        <div id="status" class="status"></div>
      </form>
      <div class="footer-note">desertgreymusicfestival.com</div>
    </div>
  </div>

  <!-- CMS mount point -->
  <div id="cms-root" style="display:none;"></div>

  <script>
    // Netlify Functions endpoint — same origin, no CORS, no extra env var
    const WORKER_URL = '/.netlify/functions/cms';

    const $login = document.getElementById('login-shell');
    const $cms = document.getElementById('cms-root');
    const $form = document.getElementById('login-form');
    const $username = document.getElementById('username');
    const $password = document.getElementById('password');
    const $btn = document.getElementById('submit-btn');
    const $status = document.getElementById('status');

    function setStatus(msg, type) {
      $status.textContent = msg || '';
      $status.className = 'status' + (type ? ' ' + type : '');
    }

    // 1. Check existing session
    fetch(WORKER_URL + '/auth/me', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(session => {
        if (session && session.username) bootCMS(session);
        else $login.style.display = 'grid';
      })
      .catch(() => { $login.style.display = 'grid'; });

    // 2. Sign in
    $form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = $username.value.trim();
      const password = $password.value;
      if (!username || !password) return;
      $btn.disabled = true;
      setStatus('Signing in…');
      try {
        const res = await fetch(WORKER_URL + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        if (res.status === 429) {
          setStatus('Too many attempts. Please wait a moment.', 'err');
        } else if (res.status === 401) {
          setStatus('Incorrect username or password.', 'err');
        } else if (!res.ok) {
          setStatus('Something went wrong. Try again.', 'err');
        } else {
          const data = await res.json();
          setStatus('Welcome.', 'ok');
          setTimeout(() => bootCMS(data), 400);
        }
      } catch (err) {
        setStatus('Network error. Try again.', 'err');
      } finally {
        $btn.disabled = false;
      }
    });

    // 3. Boot Decap CMS pointed at the Worker proxy
    function bootCMS(session) {
      $login.style.display = 'none';
      // Show transient loading message in our root, then remove once Decap mounts
      $cms.style.display = 'block';
      $cms.classList.add('active');
      $cms.innerHTML = '<div class="loading">Loading editor…</div>';

      window.CMS_MANUAL_INIT = true;
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js';
      s.onload = async () => {
        const cfgText = await fetch('/admin/config.yml', { cache: 'no-store' }).then(r => r.text());
        const jsyaml = await import('https://cdn.skypack.dev/js-yaml').then(m => m.default);
        const cfg = jsyaml.load(cfgText);
        cfg.backend = {
          name: 'proxy',
          proxy_url: WORKER_URL + '/api/v1',
          branch: (cfg.backend && cfg.backend.branch) || 'main'
        };
        cfg.publish_mode = 'simple';
        cfg.site_url = window.location.origin;
        cfg.display_url = window.location.origin;
        cfg.logo_url = '/favicon-256.png';
        window.CMS.init({ config: cfg });

        // Hide our placeholder root the moment Decap mounts to #nc-root
        const observer = new MutationObserver(() => {
          const nc = document.getElementById('nc-root');
          if (nc && nc.children.length > 0) {
            $cms.style.display = 'none';
            $cms.innerHTML = '';
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        // Fallback: also hide after 2s just in case
        setTimeout(() => { $cms.style.display = 'none'; $cms.innerHTML = ''; }, 2500);
      };
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
