<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Desert Grey · Content Editor</title>
  <link rel="icon" href="/favicon-32.png" />
</head>
<body>
  <script>
    // Session gate — check /auth/me first; redirect to login if not authenticated.
    fetch('/.netlify/functions/cms/auth/me', { credentials: 'include' })
      .then(r => {
        if (!r.ok) {
          location.replace('/admin/login.html');
        } else {
          // Load Decap CMS — it auto-loads /admin/config.yml
          const s = document.createElement('script');
          s.src = 'https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js';
          document.head.appendChild(s);
        }
      })
      .catch(() => location.replace('/admin/login.html'));
  </script>
</body>
</html>
